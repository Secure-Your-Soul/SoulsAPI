[package]
name = "souls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SoulsAPI (facade) for the Secure Your Soul project"
documentation = "https://docs.rs/souls"

[dependencies]
souls-http  = { workspace = true, optional = true }
souls-crypt = { workspace = true, optional = true }
souls-sdk   = { workspace = true, optional = true }

[features]
default = []
http  = ["dep:souls-http"]
crypt = ["dep:souls-crypt"]
sdk   = ["dep:souls-sdk"]
full  = ["http", "crypt", "sdk"]