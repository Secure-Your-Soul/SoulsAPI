[package]
name = "souls-sdk"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SoulsAPI no_std runtime SDK for Fearless"
documentation = "https://docs.rs/souls-sdk"

[lib]
name = "souls_sdk"

[dependencies]
rustix = { version = "1.1", features = [
    "fs",       # open, read, write, mkdir, ...
    "io",       # io::read, io::write, io::dup2, ...
    "mount",    # mount, umount
    "process",  # waitpid, getpid, sigprocmask, ...
    "stdio",    # stdio::stdout, stdio::stderr
    "runtime",  # exit_group
] }
rusty_alloc = { package = "ps-rusty_alloc", version = "2.3" }